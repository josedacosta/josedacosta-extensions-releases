name: Sync index

# Keeps README.md and each extensions/<slug>/extension.json in sync with the
# published releases. Fires when a release is created here (including releases
# pushed by another repository's workflow via a PAT), and can be run by hand.

on:
  release:
    types: [ published, edited, deleted ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-index
  cancel-in-progress: false

jobs:
  sync:
    name: Rebuild release index
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A `release` event checks out the tag (detached HEAD); force the branch so
      # the commit below can be pushed back to main.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild index from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-index.mjs

      - name: Commit if changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Index already up to date."
            exit 0
          fi
          git config user.name "José DA COSTA"
          git config user.email "contact@josedacosta.info"
          git add -A
          git commit -m "chore: sync release index"
          git push

      - name: Revalidate the showcase site
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "${REVALIDATE_SECRET:-}" ]; then
            echo "REVALIDATE_SECRET not set, skipping revalidation."
            exit 0
          fi
          # On-demand ISR: the showcase caches GitHub data aggressively and is
          # refreshed instantly here on every release. Non-fatal on failure.
          curl -fsS -X POST https://extensions.josedacosta.net/api/revalidate \
            -H "x-revalidate-secret: ${REVALIDATE_SECRET}" \
            && echo "Showcase revalidated." \
            || echo "Revalidate call failed (non-fatal)."
